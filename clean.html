<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stag & Grain</title>
<style>html,body{margin:0;background:#f6f1e8}</style>
</head>
<body>
<script>
(async function(){
  try {
    const response = await fetch('/index.html', { cache: 'no-store' });
    if (!response.ok) throw new Error('Could not load homepage');
    const html = await response.text();
    const doc = new DOMParser().parseFromString(html, 'text/html');

    const work = doc.querySelector('#work');
    if (work) work.remove();
    doc.querySelectorAll('a[href="#work"]').forEach(function(link){ link.remove(); });

    document.open();
    document.write('<!doctype html>' + doc.documentElement.outerHTML);
    document.close();
  } catch (error) {
    document.body.innerHTML = '<main style="max-width:700px;margin:80px auto;padding:24px;font-family:Georgia,serif;color:#1e211c"><h1>Stag & Grain</h1><p>Please refresh the page.</p></main>';
  }
})();
</script>
</body>
</html>
