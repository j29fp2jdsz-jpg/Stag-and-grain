<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stag & Grain | Furniture Restoration & Restored Stag Furniture</title>
<meta name="description" content="Furniture restoration, restored Stag furniture and selected Stag buying and trade-in from South Wales.">
<style>html,body{margin:0;background:#f6f1e8}body{min-height:100vh}</style>
</head>
<body>
<script>
(async function(){
  var source='https://raw.githubusercontent.com/j29fp2jdsz-jpg/Stag-and-grain/3b9a222f2bae2a79182af3f57cf31deb6e9e0d6c/index.html';
  try{
    var response=await fetch(source,{cache:'no-store'});
    if(!response.ok) throw new Error('Could not load site');
    var html=await response.text();
    var doc=new DOMParser().parseFromString(html,'text/html');
    var work=doc.querySelector('#work');
    if(work) work.remove();
    doc.querySelectorAll('a[href="#work"]').forEach(function(link){link.remove();});
    document.open();
    document.write('<!doctype html>'+doc.documentElement.outerHTML);
    document.close();
  }catch(error){
    document.body.innerHTML='<main style="max-width:700px;margin:80px auto;padding:24px;font-family:Georgia,serif;color:#1e211c"><h1>Stag & Grain</h1><p>Please refresh the page.</p></main>';
  }
})();
</script>
</body>
</html>
