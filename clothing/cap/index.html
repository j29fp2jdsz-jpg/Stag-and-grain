<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stag & Grain Clothing</title><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://stagandgrain.com/clothing/cap/"><link rel="stylesheet" href="/assets/clothing.css"></head><body><div class="cw-top">Stag & Grain · Made to order</div><header class="cw-head"><div class="cw-shell cw-headin"><a class="cw-back" href="/clothing/">← Clothing</a><a class="cw-logo" href="/"><img src="/assets/brand/stag-grain-logo-transparent.webp" alt="Stag & Grain"></a><nav class="cw-nav"><a href="/available/">Furniture</a><a href="/clothing/">Clothing</a></nav></div></header><main id="product"></main><footer class="cw-foot">Stag & Grain Clothing · From the workshop to the weekend.</footer><script src="/assets/clothing.js"></script><script>const slug="cap",p=SG_CLOTHING.products.find(x=>x.slug===slug),root=document.getElementById('product');if(!p){location.href='/clothing/'}else{document.title=p.name+' | Stag & Grain Clothing';let colour='green',size=p.sized?'M':'One size',qty=1;root.innerHTML='<section class="cw-product"><div class="cw-shell cw-layout"><div class="cw-gallery"><img id="mainimg" src="'+SG_CLOTHING.img(p,colour)+'" alt="Stag & Grain '+p.name+' in Heritage Green"></div><div class="cw-info"><a class="cw-breadcrumb" href="/clothing/">Stag & Grain Clothing</a><p class="cw-kicker" style="margin-top:24px">Made to order</p><h1>'+p.name+'</h1><p class="cw-price">£'+p.price+'</p><p class="cw-prose">'+p.copy+'</p><span class="cw-label">Colour</span><div class="cw-colours" id="colours">'+SG_CLOTHING.colors.map((c,i)=>'<button class="cw-choice '+(!i?'active':'')+'" data-colour="'+c[0]+'" data-label="'+c[1]+'">'+c[1]+'</button>').join('')+'</div>'+(p.sized?'<span class="cw-label">Size</span><div class="cw-sizes" id="sizes">'+['S','M','L','XL','XXL'].map(x=>'<button class="cw-choice '+(x==='M'?'active':'')+'" data-size="'+x+'">'+x+'</button>').join('')+'</div>':'')+'<span class="cw-label">Quantity</span><div class="cw-sizes"><button class="cw-choice active" id="qty">1</button></div><a class="cw-order" id="order" href="#">Request this piece</a><p class="cw-note"><strong>Made to order for Stag & Grain.</strong> Please allow additional time for preparation and dispatch. We’ll confirm the order details and availability with you before anything is finalised.</p></div></div></section><section class="cw-related"><div class="cw-shell"><h2>More from the collection</h2><div class="cw-grid" id="related" style="padding-bottom:0"></div></div></section>';const img=document.getElementById('mainimg'),order=document.getElementById('order');function update(){const label=SG_CLOTHING.colors.find(c=>c[0]===colour)[1];img.src=SG_CLOTHING.img(p,colour);img.alt='Stag & Grain '+p.name+' in '+label;const params=new URLSearchParams({type:'Clothing order request',product:p.name,colour:label,quantity:String(qty)});if(p.sized)params.set('size',size);order.href='/contact.html?'+params.toString()}document.querySelectorAll('[data-colour]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-colour]').forEach(x=>x.classList.remove('active'));b.classList.add('active');colour=b.dataset.colour;update()});document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-size]').forEach(x=>x.classList.remove('active'));b.classList.add('active');size=b.dataset.size;update()});document.getElementById('qty').onclick=e=>{qty=qty>=5?1:qty+1;e.currentTarget.textContent=qty;update()};document.getElementById('related').innerHTML=SG_CLOTHING.products.filter(x=>x.slug!==slug).slice(0,3).map(x=>'<a class="cw-card" href="/clothing/'+x.slug+'/"><div class="cw-media"><img src="'+SG_CLOTHING.img(x,'green')+'" alt="'+x.name+'" loading="lazy"></div><div class="cw-copy"><h2>'+x.name+'</h2><p class="cw-price">£'+x.price+'</p></div></a>').join('');update()}</script></body></html>
