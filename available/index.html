<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Available Vintage Furniture | Stag & Grain</title><meta name="description" content="Browse available restored vintage furniture and newly arrived stock from Stag & Grain in South Wales, with UK delivery available."><link rel="canonical" href="https://stagandgrain.com/available/"><meta name="robots" content="index,follow,max-image-preview:large"><link rel="stylesheet" href="/assets/commerce.css"><style>.sg-card-carousel{position:relative;width:100%;height:100%;touch-action:pan-y}.sg-card-carousel>img{width:100%;height:100%;object-fit:contain;display:block}.sg-card-arrow{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:50%;background:rgba(25,44,34,.9);color:#fff;font:25px/1 Georgia,serif;cursor:pointer;z-index:2;display:grid;place-items:center}.sg-card-prev{left:10px}.sg-card-next{right:10px}.sg-card-arrow:focus-visible{outline:3px solid #fff;outline-offset:2px}</style></head><body class="sg-page"><header><div class="sg-shell sg-page-head"><a class="sg-wordmark" href="/">STAG & GRAIN</a><a class="sg-page-nav" href="/contact.html">Contact</a></div></header><main><section class="sg-list-hero"><div class="sg-shell"><p class="sg-kicker">Current collection</p><h1>Available furniture</h1><p>Browse restored pieces ready to buy alongside newly arrived stock now open for enquiries.</p><p class="sg-reassure">South Wales based · UK delivery available · Local collection welcome</p></div></section><section class="sg-commerce" style="padding-top:24px"><div class="sg-shell"><div id="inventory-grid" class="sg-grid"></div></div></section></main><script src="/assets/inventory.js"></script><script>const grid=document.getElementById("inventory-grid");grid.innerHTML=window.STAG_INVENTORY.filter(p=>["available","new-stock"].includes(p.status)).map(p=>{const n=p.status==="new-stock";return '<article class="sg-card"><div class="sg-media"><div class="sg-card-carousel" data-gallery="'+p.slug+'" tabindex="0" role="region" aria-label="'+p.name+' image gallery"><img src="'+p.image+'" alt="'+p.name+'" loading="lazy">'+((p.gallery&&p.gallery.length>1)?'<button class="sg-card-arrow sg-card-prev" type="button" aria-label="Previous image">‹</button><button class="sg-card-arrow sg-card-next" type="button" aria-label="Next image">›</button>':'')+'</div></div><div class="sg-copy"><p class="sg-availability'+(n?' sg-new':'')+'">'+(n?'New stock':'Available now')+'</p><p class="sg-cat">'+p.category+'</p><h3>'+p.name+'</h3>'+(n?'<p class="sg-price sg-new-stock-card">New stock</p>':'<p class="sg-price">'+p.priceLabel+'</p><p class="sg-delivery-note">Price excludes delivery. UK delivery quoted separately by location.</p>')+'<div class="sg-actions"><a class="sg-btn sg-primary" href="/available/'+p.slug+'/">View Piece</a>'+(n?'<a class="sg-btn sg-secondary" href="/contact.html?product='+encodeURIComponent(p.name)+'&type=Furniture%20enquiry">Enquire Now</a>':'<a class="sg-btn sg-secondary" href="'+p.etsyUrl+'" target="_blank" rel="noopener">Buy on Etsy</a>')+'</div></div></article>'}).join("");;document.querySelectorAll(".sg-card-carousel").forEach(el=>{const p=window.STAG_INVENTORY.find(x=>x.slug===el.dataset.gallery),g=(p&&p.gallery&&p.gallery.length?p.gallery:[p.image]);if(g.length<2)return;let i=0,x=null,img=el.querySelector("img"),show=n=>{i=(n+g.length)%g.length;img.src=g[i];img.alt=p.name+" — image "+(i+1)+" of "+g.length};el.querySelector(".sg-card-prev").addEventListener("click",e=>{e.preventDefault();e.stopPropagation();show(i-1)});el.querySelector(".sg-card-next").addEventListener("click",e=>{e.preventDefault();e.stopPropagation();show(i+1)});el.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"){e.preventDefault();show(i-1)}else if(e.key==="ArrowRight"){e.preventDefault();show(i+1)}});el.addEventListener("touchstart",e=>{x=e.changedTouches[0].clientX},{passive:true});el.addEventListener("touchend",e=>{if(x===null)return;const d=e.changedTouches[0].clientX-x;x=null;if(Math.abs(d)>45)show(i+(d<0?1:-1))},{passive:true})});</script></body></html>
