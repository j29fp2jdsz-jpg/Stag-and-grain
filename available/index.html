<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Available Vintage Furniture | Stag & Grain</title><meta name="description" content="Browse currently available restored Stag Minstrel and vintage furniture from Stag & Grain in South Wales, with UK delivery available."><link rel="canonical" href="https://stagandgrain.com/available/"><meta name="robots" content="index,follow,max-image-preview:large"><link rel="stylesheet" href="/assets/commerce.css"></head><body class="sg-page"><header><div class="sg-shell sg-page-head"><a class="sg-wordmark" href="/">STAG & GRAIN</a><a class="sg-page-nav" href="/contact.html">Contact</a></div></header><main><section class="sg-list-hero"><div class="sg-shell"><p class="sg-kicker">Current collection</p><h1>Available furniture</h1><p>Individually restored vintage furniture, finished by hand in South Wales and ready for its next home.</p><p class="sg-reassure">South Wales based · UK delivery available · Local collection welcome</p></div></section><section class="sg-commerce" style="padding-top:24px"><div class="sg-shell"><div id="inventory-grid" class="sg-grid"></div></div></section></main><script src="/assets/inventory.js"></script><script>const grid=document.getElementById('inventory-grid'),shop=window.STAG_ETSY_SHOP;grid.innerHTML=window.STAG_INVENTORY.filter(p=>p.status==='available').map(p=>'<article class="sg-card"><div class="sg-media"><img src="'+p.image+'" alt="'+p.name+'"></div><div class="sg-copy"><p class="sg-cat">'+p.category+'</p><h3>'+p.name+'</h3><p class="sg-desc">'+p.short+'</p><p class="sg-price">'+p.priceLabel+'</p><div class="sg-actions"><a class="sg-btn sg-primary" href="/available/'+p.slug+'/">View Piece</a><a class="sg-btn sg-secondary" href="'+(p.etsyUrl||shop)+'" target="_blank" rel="noopener">Buy on Etsy</a></div></div></article>').join('');</script></body></html>
