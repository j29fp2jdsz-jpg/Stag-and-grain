<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Available Vintage Furniture | Stag & Grain</title><meta name="description" content="Browse available restored vintage furniture and newly arrived stock from Stag & Grain in South Wales, with UK delivery available."><link rel="canonical" href="https://stagandgrain.com/available/"><meta name="robots" content="index,follow,max-image-preview:large"><link rel="stylesheet" href="/assets/commerce.css"></head><body class="sg-page"><header><div class="sg-shell sg-page-head"><a class="sg-wordmark" href="/">STAG & GRAIN</a><a class="sg-page-nav" href="/contact.html">Contact</a></div></header><main><section class="sg-list-hero"><div class="sg-shell"><p class="sg-kicker">Current collection</p><h1>Available furniture</h1><p>Browse restored pieces ready to buy alongside newly arrived stock now open for enquiries.</p><p class="sg-reassure">South Wales based · UK delivery available · Local collection welcome</p></div></section><section class="sg-commerce" style="padding-top:24px"><div class="sg-shell"><div id="inventory-grid" class="sg-grid"></div></div></section></main><script src="/assets/inventory.js"></script><script>const grid=document.getElementById("inventory-grid");grid.innerHTML=window.STAG_INVENTORY.filter(p=>["available","new-stock"].includes(p.status)).map(p=>{const n=p.status==="new-stock";return '<article class="sg-card"><div class="sg-media"><img src="'+p.image+'" alt="'+p.name+'" loading="lazy"></div><div class="sg-copy"><p class="sg-availability'+(n?' sg-new':'')+'">'+(n?'New stock':'Available now')+'</p><p class="sg-cat">'+p.category+'</p><h3>'+p.name+'</h3>'+(n?'<p class="sg-price sg-new-stock-card">New stock</p>':'<p class="sg-price">'+p.priceLabel+'</p><p class="sg-delivery-note">Price excludes delivery. UK delivery quoted separately by location.</p>')+'<div class="sg-actions"><a class="sg-btn sg-primary" href="/available/'+p.slug+'/">View Piece</a>'+(n?'<a class="sg-btn sg-secondary" href="/contact.html?product='+encodeURIComponent(p.name)+'&type=Furniture%20enquiry">Enquire Now</a>':'<a class="sg-btn sg-secondary" href="'+p.etsyUrl+'" target="_blank" rel="noopener">Buy on Etsy</a>')+'</div></div></article>'}).join("");</script></body></html>
