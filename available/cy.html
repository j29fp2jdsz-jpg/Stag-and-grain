)+'&type=Ymholiad%20am%20ddodrefn">Holi Nawr</a>':'<a class="sg-btn sg-secondary" href="'+p.etsyUrl+'" target="_blank" rel="noopener">Prynu ar Etsy</a>')+'</div></div></article>'}).join("");document.querySelectorAll(".sg-card-carousel").forEach(el=>{const p=window.STAG_INVENTORY.find(x=>x.slug===el.dataset.gallery),g=(p&&p.gallery&&p.gallery.length?p.gallery:[p.image]);if(g.length<2)return;let i=0,x=null,img=el.querySelector("img"),show=n=>{i=(n+g.length)%g.length;img.src=g[i]};el.querySelector(".sg-card-prev").addEventListener("click",e=>{e.preventDefault();show(i-1)});el.querySelector(".sg-card-next").addEventListener("click",e=>{e.preventDefault();show(i+1)});el.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"){e.preventDefault();show(i-1)}else if(e.key==="ArrowRight"){e.preventDefault();show(i+1)}});el.addEventListener("touchstart",e=>{x=e.changedTouches[0].clientX},{passive:true});el.addEventListener("touchend",e=>{if(x===null)return;const d=e.changedTouches[0].clientX-x;x=null;if(Math.abs(d)>45)show(i+(d<0?1:-1))},{passive:true})});</script></body></html>
